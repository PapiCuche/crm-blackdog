# Servicios base para desarrollo local (Fase 0.5).
# Uso: docker compose -f infra/docker/compose.yaml --env-file infra/env/.env up -d
name: crm-blackdog

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?definir en infra/env/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en infra/env/.env}
      CRM_DB_NAME: ${CRM_DB_NAME:-crm}
      CRM_MIGRATOR_PASSWORD: ${CRM_MIGRATOR_PASSWORD:?definir en infra/env/.env}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:?definir en infra/env/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18: el volumen se monta en /var/lib/postgresql (PGDATA en subdirectorio por versión)
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  pgdata:
  redisdata:
