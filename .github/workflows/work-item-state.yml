name: work-item-state

# Trusted (A-02): `pull_request_target` ejecuta este archivo tal como está en la rama base,
# así que un PR no puede cambiar la lógica que usa `issues: write`. Sin checkout: solo API.
# Datos del evento solo por variables de entorno (nunca `${{ }}` dentro de `run`).
on:
  pull_request_target:
    types: [opened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  sync:
    name: Sync work item status
    # Solo PRs del propio repositorio (nunca forks).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Actualizar labels de estado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Solo palabras de cierre (Closes/Fixes/Resolves); "Refs" nunca identifica al work item.
          issues=$(printf '%s' "${BODY:-}" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -u || true)
          count=$(printf '%s' "$issues" | grep -c . || true)
          if [ "$count" != "1" ]; then
            echo "Se esperaba exactamente un work item de cierre y hay $count: no se cambia ningún estado."
            exit 0
          fi
          n="$issues"
          labels=$(gh api "repos/$REPO/issues/$n/labels" --jq '.[].name')
          has() { printf '%s\n' "$labels" | grep -qx "$1"; }
          if ! has work-item; then echo "#$n no es un work item: se ignora."; exit 0; fi

          case "$ACTION" in
            opened|ready_for_review)
              if has status:blocked || has status:done; then
                echo "#$n está blocked/done: no pasa a in-progress."; exit 0
              fi
              add="status:in-progress"; remove="status:ready" ;;
            closed)
              if [ "$MERGED" = "true" ]; then
                add="status:done"; remove="status:in-progress status:ready"
              elif has status:in-progress; then
                add="status:ready"; remove="status:in-progress"
              else
                echo "#$n no estaba in-progress: sin cambios."; exit 0
              fi ;;
            *) exit 0 ;;
          esac
          for r in $remove; do
            gh api -X DELETE "repos/$REPO/issues/$n/labels/${r//:/%3A}" >/dev/null 2>&1 || true
          done
          gh api -X POST "repos/$REPO/issues/$n/labels" -f "labels[]=$add" >/dev/null
          echo "#$n: -[$remove] +$add"
