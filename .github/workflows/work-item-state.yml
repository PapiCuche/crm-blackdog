name: work-item-state

# Trusted (A-02): `pull_request_target` ejecuta este archivo tal como está en la rama base,
# y la lógica (`work_item_state.py`) sale de un checkout de la rama por defecto: un PR no
# puede cambiar el código que usa `issues: write`. Nunca checkout ni ejecución del head.
# Invariante: no se muta un work item que no corresponda exactamente al PR (un único issue
# de cierre, issue real con `work-item`, `### Rama` == rama del PR) ni desde un estado
# de origen no permitido. Datos del evento solo por variables de entorno.
on:
  pull_request_target:
    types: [opened, ready_for_review, closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  sync:
    name: Sync work item status
    # Solo PRs del propio repositorio (nunca forks).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted (rama por defecto, nunca el head del PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Registrar la fuente trusted ejecutada
        env:
          TRUSTED_REF: ${{ github.event.repository.default_branch }}
        run: |
          echo "Trusted work-item-state source: $TRUSTED_REF @ $(git rev-parse HEAD)"

      - name: Unit tests de la lógica de estado (trusted)
        working-directory: .github/scripts
        run: python3 -m unittest -q test_work_item_state

      - name: Aplicar transición (solo si el work item corresponde al PR)
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 work_item_state.py
